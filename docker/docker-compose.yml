version: '3.8'

services:
  mindmap-wizard:
    build: .
    image: ai-mindmap-wizard:latest
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
    command: python tools/pipeline.py /app/input my_project --output-dir /app/output
